{% extends "base.html" %}

{% block title %}{{ product.name }} — DevStore{% endblock %}

{% block content %}
<div style="background: white; border: 1px solid #e5e7eb; border-radius: 12px; padding: 2.5rem; max-width: 800px; margin: 2rem auto; display: grid; grid-template-columns: 1fr 1fr; gap: 2.5rem;">
  <div>
    <div style="background: #f3f4f6; border-radius: 8px; height: 260px; display: flex; align-items: center; justify-content: center; font-size: 3rem; color: #9ca3af;">
      📦
    </div>
  </div>
  <div>
    <span class="product-tag">{{ product.category }}</span>
    <h1 style="font-size: 1.75rem; color: #064e3b; margin: 0.5rem 0;" id="product-detail-name">{{ product.name }}</h1>
    <p style="color: #6b7280; font-size: 1rem; margin-bottom: 1.5rem;" id="product-detail-desc">{{ product.description }}</p>
    
    <div class="product-price" style="font-size: 1.75rem; margin-bottom: 1.5rem;" id="product-detail-price">
      ${{ "%.2f"|format(product.price) }}
    </div>

    <form action="/cart/add" method="POST" id="add-to-cart-form">
      <input type="hidden" name="product_id" value="{{ product.id }}">
      <div class="form-group" style="margin-bottom: 1rem;">
        <label for="quantity">Quantity</label>
        <input type="number" id="quantity" name="quantity" value="1" min="1" max="10" style="width: 100px;">
      </div>
      <button type="submit" id="btn-detail-add-to-cart" class="btn btn-primary" style="width: 100%; padding: 0.85rem;">Add to Shopping Cart</button>
    </form>
    <div style="margin-top: 1rem;">
      <a href="/products" id="link-back-products" style="color: #047857; text-decoration: none; font-size: 0.9rem;">&larr; Back to Catalog</a>
    </div>
  </div>
</div>
{% endblock %}
