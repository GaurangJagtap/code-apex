{% extends "base.html" %}

{% block title %}Checkout — DevStore{% endblock %}

{% block content %}
<div class="form-card" style="max-width: 650px;">
  <h1 style="font-size: 1.75rem; color: #064e3b; margin-bottom: 0.5rem;" id="checkout-heading">Shipping & Checkout</h1>
  <p style="color: #6b7280; font-size: 0.9rem; margin-bottom: 1.5rem;">Please enter your delivery details to complete the purchase.</p>

  {% if error %}
  <div class="alert alert-danger" id="checkout-error" role="alert">{{ error }}</div>
  {% endif %}

  <form action="/checkout" method="POST" id="checkout-form">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
      <div class="form-group">
        <label for="fullname">Full Name *</label>
        <input type="text" id="fullname" name="fullname" required value="{{ default_name or '' }}" placeholder="Sarah Connor">
      </div>
      <div class="form-group">
        <label for="email">Email Address *</label>
        <input type="email" id="email" name="email" required value="{{ default_email or '' }}" placeholder="sarah@example.com">
      </div>
    </div>

    <div class="form-group">
      <label for="address">Street Address *</label>
      <input type="text" id="address" name="address" required placeholder="124 Silicon Avenue, Suite 400">
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem;">
      <div class="form-group">
        <label for="city">City *</label>
        <input type="text" id="city" name="city" required placeholder="San Francisco">
      </div>

      <!-- Seeded Defect BUG-03: Postal Code is marked with * but NOT enforced by required validation attribute or backend check! -->
      <div class="form-group">
        <label for="postal_code">Postal / ZIP Code *</label>
        <input type="text" id="postal_code" name="postal_code" placeholder="94107">
      </div>

      <div class="form-group">
        <label for="country">Country *</label>
        <select id="country" name="country">
          <option value="US">United States</option>
          <option value="CA">Canada</option>
          <option value="UK">United Kingdom</option>
          <option value="DE">Germany</option>
          <option value="IN">India</option>
        </select>
      </div>
    </div>

    <div class="form-group" style="margin-top: 1rem;">
      <label for="payment_method">Payment Method</label>
      <select id="payment_method" name="payment_method">
        <option value="card">Simulated Credit Card</option>
        <option value="cod">Cash on Delivery (Demo Mode)</option>
      </select>
    </div>

    <!-- Seeded Defect BUG-04: Button does not disable or throttle on click when defect is active -->
    <div style="margin-top: 1.5rem;">
      {% if bug04_active %}
      <button type="submit" id="btn-place-order" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem;">
        Place Order Now
      </button>
      {% else %}
      <button type="submit" id="btn-place-order" class="btn btn-primary" onclick="this.disabled=true; this.innerText='Processing Order...'; this.form.submit();" style="width: 100%; padding: 0.85rem; font-size: 1rem;">
        Place Order Now
      </button>
      {% endif %}
    </div>
  </form>
</div>
{% endblock %}
