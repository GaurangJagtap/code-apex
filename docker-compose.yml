version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - "5001:5001"
    environment:
      - LLM_PROVIDER=demo
      - DATABASE_URL=sqlite:///./apex_qa.db
      - FRONTEND_ORIGIN=http://localhost:5173
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
